# Rack configuration for simulator tests
[base]
  name = "sim-node-01"

[rack]
  name = "sim-node-01"
  id = ""

[mixer]
  host = "127.0.0.1"
  port = 18080

[snake]
  port = 4222
  url = "nats://localhost:4222"
  connect_timeout = "30s"
  reconnect_wait = "2s"

[telemetry]
  enabled = true
  port = 18090

[store]
  dir = "./data"

[logging]
  level = "debug"
  format = "json"
  filename = "logs/fluxrig.log"

[gears]
  # Simulator gears will be defined in the scenario
