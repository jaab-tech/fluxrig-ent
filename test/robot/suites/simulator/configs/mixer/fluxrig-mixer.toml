# fluxrig-mixer configuration for simulator tests
[api]
  port = 18080

[logging]
  level = "debug"
  format = "json"
  filename = "logs/mixer.log"

[snake]
  port = 4222
  cluster_key = "data/cluster.key"

[telemetry]
  enabled = true
  port = 18090

[store]
  path = "data/telemetry.duckdb"

[enrollment]
  auto_adopt = true

[scenario]
  dir = "scenarios"
