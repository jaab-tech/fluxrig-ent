#
# Rack configuration for the enterprise e2e tests. ent_e2e.sh fills the @...@ values.

[logging]
level = "trace"
filename = "logs/rack.log"

[store]
dir = "./data"
wal_max_size_mb = 500
state_file = "state.flux"

[rack]
name = "@RACK_NAME@"
machine_id = 100

[rack.bus]
url = "nats://127.0.0.1:@SNAKE_PORT@"
stream_name = "flux-msg"

[rack.telemetry]
enabled = true
